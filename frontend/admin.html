<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aarisha Admin</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-page { position:relative; min-height:100vh; padding:80px 40px; background:var(--forest-deep); }
    .admin-panel { position:relative; max-width:1200px; margin:auto; padding:0; }
    .admin-logout { position:absolute; top:12px; right:0; }
    .admin-panel h1 { font:500 clamp(36px,6vw,56px) var(--font-heading); color:var(--gold-light); letter-spacing:3px; margin-bottom:10px; }
    .admin-panel > p { color:rgba(255,255,255,.75); margin-bottom:28px; }
    .admin-form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .admin-form .full { grid-column:1/-1; }
    .admin-form label { display:block; color:var(--gold); font-size:12px; letter-spacing:1px; text-transform:uppercase; margin-bottom:7px; }
    .admin-form input, .admin-form select, .admin-form textarea { width:100%; padding:12px; color:var(--white); background:rgba(255,255,255,.06); border:1px solid rgba(201,162,75,.35); font:300 14px var(--font-body); }
    .admin-actions { display:flex; gap:12px; margin-top:20px; }
    .admin-products { margin-top:36px; display:grid; gap:0; }
    .admin-product { display:grid; grid-template-columns:72px minmax(160px,1fr) 110px 90px 622px; gap:22px; align-items:center; padding:20px 0; border-bottom:1px solid rgba(201,162,75,.24); color:var(--white); }
    .admin-product-head { padding-block:0 12px; border:0; color:var(--gold); font-size:12px; letter-spacing:1px; text-transform:uppercase; }
    .admin-product-image { width:72px; height:72px; object-fit:cover; border:1px solid rgba(201,162,75,.35); }
    .stock-status { font-size:20px; font-weight:600; } .stock-status.in { color:#72c779; } .stock-status.out { color:#e26a6a; }
    .admin-product-actions { display:flex; flex-wrap:nowrap; gap:8px; }
    .admin-product-actions .btn-send { padding:8px 10px; white-space:nowrap; }
    .product-dialog { position:fixed; inset:0; width:min(760px, calc(100% - 32px)); max-height:calc(100vh - 32px); margin:auto; padding:32px; overflow:auto; border:1px solid var(--gold); background:var(--forest); color:var(--white); }
    .product-dialog::backdrop { background:rgba(0,0,0,.62); }
    .admin-product small, #adminStatus { color:var(--gold); } .hidden { display:none; }
    @media (max-width:1250px) { .admin-page { padding:48px 24px; } .admin-product { grid-template-columns:64px minmax(120px,1fr) 90px 70px; gap:14px; } .admin-product-head span:last-child { display:none; } .admin-product-actions { grid-column:2 / -1; } }
    @media (max-width:600px) { .admin-logout { position:static; margin-bottom:24px; } .admin-form { grid-template-columns:1fr; } .admin-product { grid-template-columns:64px 1fr; } .admin-product-head { display:none; } .admin-product-image { width:64px; height:64px; } .admin-product > :nth-child(n+3) { grid-column:2; } .admin-product-actions { flex-wrap:wrap; } }
  </style>
</head>

    <div class="stepwell-bg" aria-hidden="true">
      <svg class="stepwell-motif motif-base" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax slice"><use class="u-full" href="#stepwell-motif"></use><use class="u-slim" href="#stepwell-motif-slim"></use></svg>
    </div>
    <section class="admin-panel">
      <h1>Aarisha Admin</h1><p>Manage the public product catalogue. Admin credentials stay on the API server.</p><button class="btn-send admin-logout" id="adminLogout" type="button">Logout</button>
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:28px;flex-wrap:wrap" id="adminToolbar" hidden>
        <button class="btn-send" id="addProduct" type="button">Add Product</button>
        <button class="btn-send" id="deduplicateBtn" type="button" style="background:rgba(201,162,75,.12);border-color:rgba(201,162,75,.45)">Remove duplicates</button>
      </div>
      <form id="adminLogin" class="admin-form">
        <div><label>Email <input id="email" type="email" required autocomplete="username"></label></div>
        <div><label>Password <input id="password" type="password" required autocomplete="current-password"></label></div>
        <div class="full"><button class="btn-send" type="submit">Sign in</button></div>
      </form>
      <dialog class="product-dialog" id="productDialog"><form id="productForm" class="admin-form">
        <div><label>Name <input name="name" required></label></div><div><label>Price (INR) <input name="price" type="number" step="0.01" min="0.01" required></label></div>
        <div><label>Category <select name="category"><option value="rings">Rings</option><option value="necklaces">Necklaces</option><option value="bracelets">Bracelets</option><option value="earrings">Earrings</option></select></label></div>
        <div><label>In stock <select name="in_stock"><option value="true">Yes</option><option value="false">No</option></select></label></div>
        <div class="full"><label>Google Drive or image URL <input name="image_url" type="url" required></label></div>
        <div class="full"><label>Description <textarea name="description"></textarea></label></div>
        <div class="full admin-actions"><button class="btn-send" type="submit">Save product</button><button class="btn-send" id="cancelEdit" type="button">Cancel edit</button></div>
      </form></dialog>
      <p id="adminStatus" role="status"></p><div id="adminProducts" class="admin-products"></div>
    </section>
  </main>
  <script>
    const API = ['127.0.0.1', 'localhost'].includes(location.hostname) ? 'http://127.0.0.1:8000' : `${location.origin}/api`; let token = sessionStorage.getItem('aarisha-admin-token'); let editingId = null;
    const status = message => document.getElementById('adminStatus').textContent = message;
    const headers = () => ({ 'Content-Type':'application/json', Authorization:`Bearer ${token}` });
    const submitBtn = () => document.querySelector('#productForm button[type="submit"]');
    async function request(path, options = {}) { const response = await fetch(API + path, options); if (!response.ok) throw new Error((await response.json().catch(() => ({}))).detail || 'Request failed'); return response.status === 204 ? null : response.json(); }
    function showAdmin() { document.getElementById('adminLogin').classList.add('hidden'); document.getElementById('adminToolbar').hidden = false; loadProducts(); }
    function showProductForm(product = null) { editingId = product?.id || null; productForm.reset(); if (product) Object.entries(product).forEach(([key, value]) => { if (productForm.elements[key]) productForm.elements[key].value = value; }); document.getElementById('productDialog').showModal(); }
    const escapeHtml = value => String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    async function loadProducts() { try { const products = await request('/products'); const list = document.getElementById('adminProducts'); const header = '<div class="admin-product admin-product-head"><span>Image</span><span>Product name</span><span>Price</span><span>In stock</span><span>Actions</span></div>'; const rows = products.map(p => `<article class="admin-product"><img class="admin-product-image" src="${escapeHtml(p.image_url)}" alt=""><strong>${escapeHtml(p.name)}</strong><span>₹${Number(p.price).toFixed(2)}</span><span class="stock-status ${p.in_stock ? 'in' : 'out'}" aria-label="${p.in_stock ? 'In stock' : 'Out of stock'}">${p.in_stock ? '✓' : '✕'}</span><span class="admin-product-actions"><button class="btn-send" data-edit="${p.id}">Edit product</button><button class="btn-send" data-delete="${p.id}">Delete product</button><button class="btn-send" data-stock="${p.id}">${p.in_stock ? 'Set out of stock' : 'Set in stock'}</button></span></article>`).join(''); list.innerHTML = products.length ? header + rows : '<p>No products yet. Add your first product.</p>'; window.products = products; } catch (error) { status(error.message); } }
    document.getElementById('adminLogin').addEventListener('submit', async event => { event.preventDefault(); try { const data = {email: email.value, password: password.value}; token = (await request('/admin/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)})).access_token; sessionStorage.setItem('aarisha-admin-token', token); showAdmin(); } catch (error) { status(error.message); } });
    document.getElementById('addProduct').addEventListener('click', () => showProductForm());
    document.getElementById('productDialog').addEventListener('close', () => { editingId = null; productForm.reset(); });
    document.getElementById('productForm').addEventListener('submit', async event => { event.preventDefault(); const btn = submitBtn(); if (btn.disabled) return; btn.disabled = true; const data = Object.fromEntries(new FormData(event.target)); data.price = Number(data.price); data.in_stock = data.in_stock === 'true'; if (!data.description) delete data.description; try { await request(editingId ? `/admin/products/${editingId}` : '/admin/products', {method: editingId ? 'PATCH' : 'POST', headers: headers(), body: JSON.stringify(data)}); event.target.reset(); editingId = null; document.getElementById('productDialog').close(); status('Product saved.'); loadProducts(); } catch (error) { status(error.message); } finally { btn.disabled = false; } });
    document.getElementById('cancelEdit').addEventListener('click', () => { editingId = null; productForm.reset(); document.getElementById('productDialog').close(); });
    document.getElementById('deduplicateBtn').addEventListener('click', async () => { if (!confirm('Remove duplicate products? This keeps only the newest version of each product name in each category.')) return; const btn = document.getElementById('deduplicateBtn'); btn.disabled = true; try { const result = await request('/admin/products/deduplicate', {method:'POST', headers:headers()}); status(result.deleted ? `Removed ${result.deleted} duplicate product${result.deleted === 1 ? '' : 's'}.` : 'No duplicates found.'); loadProducts(); } catch (error) { status(error.message); } finally { btn.disabled = false; } });
    document.getElementById('adminLogout').addEventListener('click', () => { sessionStorage.removeItem('aarisha-admin-token'); localStorage.removeItem('aarisha-auth-token'); localStorage.removeItem('aarisha-auth-user'); window.location.replace('index.html'); });
    document.getElementById('adminProducts').addEventListener('click', async event => { const id = event.target.dataset.edit || event.target.dataset.delete || event.target.dataset.stock; if (!id) return; const product = window.products.find(p => p.id === id); if (event.target.dataset.edit) return showProductForm(product); if (event.target.dataset.stock) { try { await request(`/admin/products/${id}`, {method:'PATCH', headers:headers(), body:JSON.stringify({in_stock: !product.in_stock})}); loadProducts(); } catch (error) { status(error.message); } return; } if (confirm('Delete this product?')) { try { await request(`/admin/products/${id}`, {method:'DELETE', headers:headers()}); loadProducts(); } catch (error) { status(error.message); } } });
    if (token) showAdmin(); else window.location.replace('index.html');
  </script>
</body>
</html>
